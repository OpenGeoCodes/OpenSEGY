name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what `requires-python` claims, on every
        # platform a wheel targets. A pure-Python package still breaks on
        # Windows, and it breaks over path handling and text encodings — which
        # is exactly what a SEG-Y reader touches.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      - name: The examples must run, not merely import
        if: runner.os == 'Linux'
        run: |
          python -m opensegy fixtures ./fixtures
          python examples/inspect_file.py ./fixtures/rev21/layout_stanza.sgy
          python examples/survey_geometry.py ./fixtures/rev1/ieee_float.sgy
